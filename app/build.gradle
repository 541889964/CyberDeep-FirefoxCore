apply plugin: 'com.android.application'

android {
    namespace 'com.cyber.deep'
    compileSdk 36

    defaultConfig {
        applicationId "com.cyber.deep"
        minSdk 26 // 匹配 GeckoView 要求的最低版本
        targetSdk 34
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    // 直接依赖官方 Maven 仓库的 GeckoView，确保 Java 层与 Native 层版本严格一致
    implementation 'org.mozilla.geckoview:geckoview-beta-arm64-v8a:148.0.20260202090533'
}
